name: Deploy Rotary Demo

on:
  push:
    branches: ["main"]
    paths:
      - "rotary-github-pages.tar.gz"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Unpack validated site
        run: |
          mkdir _site
          tar -xzf rotary-github-pages.tar.gz -C _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
